name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint
        run: |
          pip install ruff
          ruff check src/ app.py

      - name: Import sanity check
        run: |
          python -c "import sys; sys.path.insert(0,'src'); import chunking, embed, retrieve, generate, eval, ingest"
        env:
          # prevents sentence-transformers from downloading models during import check
          TRANSFORMERS_OFFLINE: "1"
          HF_DATASETS_OFFLINE: "1"
